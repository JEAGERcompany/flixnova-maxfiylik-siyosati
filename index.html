<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlixNova — Huquqiy hujjatlar</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f0e14;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff7a1a, #ff3d81);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    color: #9c98a8;
    margin-bottom: 32px;
    font-size: 14px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link {
    display: block;
    padding: 16px 20px;
    background: #211f2c;
    border-radius: 14px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: background 0.15s ease;
  }
  a.link:hover { background: #2a2836; }
  a.link span {
    display: block;
    color: #9c98a8;
    font-weight: 400;
    font-size: 12px;
    margin-top: 4px;
  }
  footer {
    margin-top: 32px;
    color: #6b6878;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>FlixNova</h1>
    <p class="sub">Huquqiy hujjatlar</p>
    <div class="links">
      <a class="link" href="terms.html">
        Foydalanish shartlari
        <span>Ilovadan foydalanish qoidalari</span>
      </a>
      <a class="link" href="privacy.html">
        Maxfiylik siyosati
        <span>Ma'lumotlaringiz qanday ishlatiladi</span>
      </a>
    </div>
    <footer>&copy; 2026 FlixNova</footer>
  </div>
</body>
</html>
